name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Monorepo Verification & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uims
          POSTGRES_PASSWORD: uims_ci_test_secret_32_characters
          POSTGRES_DB: uims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://uims:uims_ci_test_secret_32_characters@localhost:5432/uims_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: uims_test_ci_jwt_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: uims_test_ci_jwt_refresh_secret_minimum_32_characters_long
      AUDIT_SIGNING_KEY: uims_test_ci_audit_signing_key_minimum_32_characters_long
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Deploy Prisma Migrations
        run: pnpm run db:migrate:prod

      - name: Seed Database
        run: pnpm run db:seed

      - name: Check formatting (Biome)
        run: pnpm run format:check

      - name: Lint (ESLint & Biome)
        run: pnpm run lint

      - name: Typecheck (TypeScript)
        run: pnpm run typecheck

      - name: Test (Vitest)
        run: pnpm run test

      - name: Build (Turborepo)
        run: pnpm run build
