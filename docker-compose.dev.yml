services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: uims-api-dev
    restart: unless-stopped
    ports: !override
      - "${APP_PORT:-3002}:3000"
    environment:
      NODE_ENV: development
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:-uims}:${DATABASE_PASSWORD:-uims_secret_2026}@postgres:5432/${DATABASE_NAME:-uims_db}?schema=public&connection_limit=20&pool_timeout=30
      REDIS_URL: redis://:${REDIS_PASSWORD:-uims_redis_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-uims-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-uims-jwt-refresh-secret-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-uims_meili_master_key_2026}
      S3_ENDPOINT: http://seaweedfs-filer:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uims_s3_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-uims_s3_secret}
      S3_BUCKET: ${S3_BUCKET:-uims-files}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-validators/node_modules
      - /app/packages/shared-utils/node_modules
    command: pnpm --filter @uims/api dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: uims-web-dev
    restart: unless-stopped
    ports: !override
      - "${WEB_PORT:-5679}:5679"
    environment:
      NODE_ENV: development
      CI: "true"
      VITE_API_URL: /api/v1
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes: !override
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-validators/node_modules
      - /app/packages/shared-utils/node_modules
    command: pnpm --filter @uims/web dev --host 0.0.0.0 --port 5679
