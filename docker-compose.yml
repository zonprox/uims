services:
  # ═══════════════════════════════════════════════════════════
  # DATA LAYER
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:18-alpine
    container_name: uims-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-uims}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-uims_secret_2026}
      POSTGRES_DB: ${DATABASE_NAME:-uims_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-uims} -d ${DATABASE_NAME:-uims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: uims-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-uims_redis_2026} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-uims_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: uims-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-uims_meili_master_key_2026}
      MEILI_ENV: development
      MEILI_LOG_LEVEL: INFO
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # SeaweedFS Master + Volume + Filer (S3 Gateway)
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: uims-seaweedfs-master
    restart: unless-stopped
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: uims-seaweedfs-volume
    restart: unless-stopped
    command: volume -mserver="seaweedfs-master:9333" -ip.bind=0.0.0.0 -port=8080
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: uims-seaweedfs-filer
    restart: unless-stopped
    command: filer -master="seaweedfs-master:9333" -ip.bind=0.0.0.0 -s3 -s3.port=8333
    ports:
      - "8888:8888"
      - "8333:8333"
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  # ═══════════════════════════════════════════════════════════
  # APPLICATION LAYER
  # ═══════════════════════════════════════════════════════════

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uims-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DATABASE_USER:-uims}:${DATABASE_PASSWORD:-uims_secret_2026}@postgres:5432/${DATABASE_NAME:-uims_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-uims_redis_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-uims-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-uims-jwt-refresh-secret-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-uims_meili_master_key_2026}
      S3_ENDPOINT: http://seaweedfs-filer:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uims_s3_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-uims_s3_secret}
      S3_BUCKET: ${S3_BUCKET:-uims-files}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uims-worker
    restart: unless-stopped
    command: node dist/worker.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DATABASE_USER:-uims}:${DATABASE_PASSWORD:-uims_secret_2026}@postgres:5432/${DATABASE_NAME:-uims_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-uims_redis_2026}@redis:6379
      S3_ENDPOINT: http://seaweedfs-filer:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uims_s3_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-uims_s3_secret}
      S3_BUCKET: ${S3_BUCKET:-uims-files}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: uims-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  seaweedfs_master:
    driver: local
  seaweedfs_volume:
    driver: local
  seaweedfs_filer:
    driver: local
